name: I2PdiOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    I2PD_APP_BUNDLE_IDENTIFIER: website.i2pd.ios.prototype
targets:
  I2PDCore:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/I2PDCore
      - path: Vendor/i2pd/libi2pd
      - path: Vendor/i2pd/libi2pd_client
      - path: Vendor/i2pd/daemon/HTTPServer.cpp
      - path: Vendor/i2pd/i18n
      - path: Vendor/Boost/libs/atomic/src
        excludes:
          - find_address_sse2.cpp
          - find_address_sse41.cpp
          - wait_on_address.cpp
      - path: Vendor/Boost/libs/filesystem/src
        excludes:
          - windows_file_codecvt.cpp
      - path: Vendor/Boost/libs/program_options/src
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Sources/I2PDCore"
          - "$(PROJECT_DIR)/Vendor/i2pd/libi2pd"
          - "$(PROJECT_DIR)/Vendor/i2pd/libi2pd_client"
          - "$(PROJECT_DIR)/Vendor/i2pd/daemon"
          - "$(PROJECT_DIR)/Vendor/i2pd/i18n"
          - "$(PROJECT_DIR)/Vendor/Boost"
          - "$(PROJECT_DIR)/Vendor/OpenSSL/$(PLATFORM_NAME)/include"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - MAC_OSX=1
          - BOOST_ALL_NO_LIB=1
          - OPENSSL_SUPPRESS_DEPRECATED=1
          - NO_TORRENTS=1
          - I2PD_IOS=1
  I2PDApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/I2PDApp
      - path: Sources/Shared/ShutdownActivityAttributes.swift
      - path: Vendor/i2pd/contrib/certificates
        buildPhase: resources
        type: folder
      - path: Sources/I2PDApp/Resources/hosts.txt
        buildPhase: resources
    info:
      path: Sources/I2PDApp/Info.plist
      properties:
        CFBundleDisplayName: i2pd
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(I2PD_APP_BUNDLE_IDENTIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/I2PDApp/I2PDApp-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Sources/I2PDCore"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/OpenSSL/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
          - "-lssl"
          - "-lcrypto"
    dependencies:
      - target: I2PDCore
      - target: I2PDShutdownWidget
        embed: true
  I2PDShutdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/I2PDShutdownWidget
      - path: Sources/Shared/ShutdownActivityAttributes.swift
    info:
      path: Sources/I2PDShutdownWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(I2PD_APP_BUNDLE_IDENTIFIER).ShutdownWidget"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
